<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirmare — Ședință 1:1</title>
  <meta name="robots" content="noindex" />
  <style>
    :root{--bg:#0F2A44;--cta:#F47B20;--cta2:#d96813;}
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color:#fff;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 16px;
    }
    .box{
      width:min(760px, 100%);
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.14);
      border-radius:18px;
      padding:26px 22px;
      box-shadow: 0 22px 70px rgba(0,0,0,.35);
    }
    h1{margin:0 0 10px; font-size:34px;}
    p{margin:0 0 10px; color:rgba(255,255,255,.86); line-height:1.6}
    .callout{
      margin-top:14px;
      padding:14px 14px;
      border-radius:14px;
      background: rgba(244,123,32,.14);
      border:1px solid rgba(244,123,32,.25);
    }
    .btn{
      display:inline-block;
      margin-top:16px;
      padding:12px 16px;
      border-radius:12px;
      background: var(--cta);
      color:#fff;
      text-decoration:none;
      font-weight:800;
      transition: transform .12s ease, background .12s ease;
    }
    .btn:hover{background: var(--cta2); transform: translateY(-1px);}
    .small{margin-top:10px; font-size:13px; opacity:.85}
  </style>
</head>
<body>
  <main class="box">
    <h1>Mulțumim! Plata a fost înregistrată 🎉</h1>

    <div class="callout">
      <p><strong>Revenim pentru a stabili de comun acord data și ora întâlnirii.</strong></p>
      <p class="small">Te vom contacta pe emailul folosit la plată.</p>
    </div>

    <a class="btn" href="/">Înapoi pe site</a>
  </main>
</body>
</html>
