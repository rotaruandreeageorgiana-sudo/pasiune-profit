<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mulțumim pentru achiziție</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #0F2A44;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      max-width: 640px;
      background: white;
      padding: 40px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 16px;
      color: #0F2A44;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
      margin: 12px 0;
    }
    .button {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 22px;
      background: #F47B20;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
    .small {
      font-size: 14px;
      color: #666;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mulțumim pentru achiziție!</h1>
    <p>Plata a fost înregistrată cu succes.</p>
    <p>Manualul tău va ajunge pe email în câteva minute.</p>
    <p>Verifică și folderul <strong>Promotions</strong> sau <strong>Spam</strong>, dacă nu îl vezi imediat.</p>
    <a class="button" href="https://pasiune-profit.ro/">Înapoi pe site</a>
    <p class="small">Dacă întâmpini probleme, ne poți scrie la contact@pasiune-profit.ro</p>
  </div>
</body>
</html>
