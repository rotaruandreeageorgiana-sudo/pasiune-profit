<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plată confirmată — De la Pasiune la Profit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #091d30;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
    }
    .icon { font-size: 3rem; margin-bottom: 20px; }
    h1 { font-size: 1.6rem; margin-bottom: 12px; color: #fff; }
    p { color: rgba(255,255,255,0.6); font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px; }
    .loader {
      width: 40px; height: 40px;
      border: 3px solid rgba(244,123,32,0.2);
      border-top-color: #f47b20;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      background: #f47b20;
      color: white;
      padding: 14px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Plată confirmată!</h1>
    <p>Îți pregătim accesul la manual. Vei fi redirecționat automat în câteva secunde...</p>
    <div class="loader"></div>
    <a href="index.html" class="btn" id="manualBtn">Accesează manualul →</a>
  </div>

  <script>
    // Citește parametrii din URL
    const params = new URLSearchParams(window.location.search);
    const manual = params.get('manual');
    const session = params.get('session_id');

    // Construiește URL-ul pentru index.html cu parametrii de descărcare
    let redirectUrl = 'index.html';
    if (manual) {
      redirectUrl += '?success=1&manual=' + encodeURIComponent(manual);
      if (session) redirectUrl += '&session_id=' + encodeURIComponent(session);
    }

    // Actualizează butonul manual
    document.getElementById('manualBtn').href = redirectUrl;

    // Redirect automat după 2 secunde
    setTimeout(function() {
      window.location.href = redirectUrl;
    }, 2000);
  </script>
</body>
</html>
